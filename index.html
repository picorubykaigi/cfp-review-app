<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>PicoRubyKaigi 2026 Assemble CFP Review App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <div id="app"><div class="boot">読み込み中…</div></div>

    <script src="config.js"></script>
    <script src="bridge.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
      (function () {
        var files = [
          'sheets_client.rb',
          'proposal.rb',
          'markdown_parser.rb',
          'proposals.rb',
          'ratings.rb',
          'tags.rb',
          'session.rb',
          'sheet_config.rb',
          'screen_history.rb',
          'table_state.rb',
          'views/proposal_body.rb',
          'views/signin.rb',
          'views/tags.rb',
          'views/index.rb',
          'views/show.rb',
          'review_app.rb',
        ];
        var here = document.currentScript;
        var stamp = Date.now();
        files.forEach(function (f) {
          var script = document.createElement('script');
          script.type = 'text/ruby';
          script.src = f + '?t=' + stamp;
          here.parentNode.insertBefore(script, here);
        });
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@picoruby/wasm-wasi@4.0.0/dist/init.iife.js"></script>
  </body>
</html>
